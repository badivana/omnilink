<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniLink · Server manager</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head><body><main style="max-width:1100px;margin:auto;padding:30px"><div class="brand">◎ OmniLink</div><h1>Server manager</h1><p>Manage accounts, resource limits and integrations. <a href="/client/">Open client dashboard →</a></p><p id="error" role="alert"></p><form id="login"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button></form><div id="manager" hidden><button id="logout">Sign out</button><h2>Server settings</h2><form id="settings"></form><h2>Accounts</h2><div id="accounts"></div><h2>Integration</h2><p>Flows can use the names configured here. Email sends to the account owner using TLS-enabled SMTP.</p><form id="integration"><label>Name<input name="name" required pattern="[a-zA-Z0-9_-]{1,40}"></label><label>Kind<select name="kind"><option>webhook</option><option>email</option></select></label><label>Webhook URL<input name="url" type="url"></label><label>SMTP host<input name="host"></label><label>SMTP port<input name="port" type="number" value="587"></label><label>SMTP sender<input name="sender" type="email"></label><label>SMTP username<input name="username"></label><label>Bearer token / SMTP password<input name="secret" type="password" autocomplete="new-password"></label><button>Save integration</button></form></div></main></body></html>
